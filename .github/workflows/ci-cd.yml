name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_PATH: Moongazing.OrionVault.sln
  AOT_SMOKE_PATH: tests/Moongazing.OrionVault.AotSmoke/Moongazing.OrionVault.AotSmoke.csproj

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}
      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release
      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-restore --configuration Release --verbosity normal

  aot-smoke:
    # OrionVault's AOT exit criterion: a NativeAOT publish of the field-encryption round trip
    # (DI-resolved AES-GCM) with zero trim/AOT warnings, and a native binary that exits 0.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish NativeAOT
        run: |
          dotnet publish ${{ env.AOT_SMOKE_PATH }} \
            --configuration Release \
            --runtime linux-x64 \
            --output ./aot-smoke \
            -warnaserror
      - name: Run the native binary
        run: ./aot-smoke/Moongazing.OrionVault.AotSmoke

  publish:
    needs: [build-and-test, aot-smoke]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}
      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release
      - name: Pack Packages
        # Packs the solution rather than an enumerated list of projects. Every non-shipping
        # project (tests, sample, demo, benchmarks) sets IsPackable=false, so this produces
        # exactly the src/ packages - and a newly added sub-package ships automatically instead
        # of being silently left out until someone notices it missing from NuGet.
        run: dotnet pack ${{ env.SOLUTION_PATH }} --no-build --configuration Release -o ./nupkgs
      - name: Verify every packable project produced a package
        # Guards the above: if a project stops packing (a stray IsPackable=false, a project
        # missing from the solution), fail the release instead of publishing a partial set.
        run: |
          expected=$(find src -name '*.csproj' -exec grep -L '<IsPackable>false' {} + | wc -l)
          actual=$(find ./nupkgs -name '*.nupkg' -not -name '*.symbols.nupkg' | wc -l)
          echo "Packable src projects: $expected"
          echo "Packages produced:     $actual"
          find ./nupkgs -name '*.nupkg' -printf '  %f\n' | sort
          if [ "$expected" -ne "$actual" ]; then
            echo "::error::Expected $expected packages but produced $actual. Refusing to publish a partial set."
            exit 1
          fi
      - name: Push to NuGet.org
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key "${{ secrets.NUGET }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Push to GitHub Packages
        # GitHub Packages returns non-zero on an already-published version even with
        # --skip-duplicate, which would fail the whole run on a re-publish (a patch release)
        # even though the nuget.org push above succeeded. It is a secondary mirror; don't let it
        # redden a release that actually published.
        continue-on-error: true
        run: |
          dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push "./nupkgs/*.nupkg" --source github --skip-duplicate
